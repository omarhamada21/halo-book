<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Assignment Submission — Mimir Marking</title>
<link rel="icon" type="image/png" href="/mimir.jpg">
<link rel="shortcut icon" type="image/png" href="/mimir.jpg">
<link rel="apple-touch-icon" href="/mimir.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16233F; --ink-soft: #4A5670; --paper: #E3E9F6;
    --paper-line: #CBD6ED; --card: #FBFCFE; --pen: #1D3A66;
    --pen-soft: #DDE3EE; --border: #C2CEE7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; padding: 20px; }
  .wrap { max-width: 580px; margin: 30px auto; }
  
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 28px; box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  }
  
  .tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; color: var(--pen); letter-spacing: 0.08em; font-weight: 600; margin-bottom: 6px; }
  h1 { font-family: 'Source Serif 4', serif; font-size: 24px; margin: 0 0 6px; }
  .teacher-sub { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 20px; }
  
  .deadline-box {
    background: var(--pen-soft); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-size: 13px; color: var(--pen); margin-bottom: 20px; font-weight: 500;
  }

  .deadline-expired {
    background: #FEE2E2 !important; border-color: #FCA5A5 !important;
    color: #991B1B !important; font-weight: 600 !important;
  }
  
  .task-card {
    border: 1px solid var(--border); background: #fff; border-radius: 10px;
    padding: 18px; margin-bottom: 18px;
  }
  .task-title { font-family: 'Source Serif 4', serif; font-size: 17px; margin: 0 0 10px; color: var(--pen); display: flex; justify-content: space-between; align-items: center; }

  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input[type="text"] {
    width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; background: #fff; outline: none; font-family: 'Inter', sans-serif;
  }
  input[type="text"]:focus { border-color: var(--pen); }
  
  .dropzone {
    border: 2px dashed var(--border); border-radius: 10px; padding: 20px 16px;
    text-align: center; cursor: pointer; background: #FAFBFD; transition: all 0.2s;
  }
  .dropzone:hover { border-color: var(--pen); background: var(--pen-soft); }
  
  .page-preview { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .page-chip {
    background: var(--pen-soft); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 12px; font-size: 12.5px; display: flex; justify-content: space-between; align-items: center;
  }
  .page-remove { color: #DC2626; border: none; background: none; font-weight: bold; cursor: pointer; font-size: 16px; }
  
  .btn-submit {
    width: 100%; background: var(--ink); color: #fff; border: none; border-radius: 8px;
    padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: opacity 0.2s;
  }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .success-banner {
    display: none; text-align: center; padding: 30px 10px;
  }
  .success-banner h2 { color: #059669; font-family: 'Source Serif 4', serif; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="card" id="submission-form-card">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
      <img src="/mimir.jpg" alt="Mimir" style="width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--pen); object-fit: cover; object-position: top center;">
      <div class="tag" style="margin: 0;">Mimir Marking — Student Portal</div>
    </div>
    <h1 id="assign-title">Loading Assignment...</h1>
    <div class="teacher-sub" id="assign-teacher"></div>
    <div class="deadline-box" id="assign-deadline" style="display: none;"></div>

    <form id="student-form" onsubmit="handleStudentSubmit(event)">
      <div class="form-group">
        <label>Your Full Name</label>
        <input type="text" id="student-name" required placeholder="e.g. Fares Ahmed" />
        <small style="color:var(--ink-soft); font-size:11.5px; margin-top:4px; display:block;">🔒 Protected: Only 1 submission allowed from this device.</small>
      </div>

      <div id="tasks-container">
        </div>

      <button type="submit" class="btn-submit" id="submit-btn">🚀 Submit All Tasks to Teacher</button>
    </form>
  </div>

  <div class="card success-banner" id="success-screen">
    <h2>✓ Work Submitted Successfully!</h2>
    <p style="color: var(--ink-soft); line-height: 1.5; font-size: 14px;">
      Thank you, <b id="submitted-name"></b>. Your work has been delivered to your teacher and evaluated.
    </p>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const bundleCode = urlParams.get('bundle') || urlParams.get('code');
  
  function getOrCreateDeviceId() {
    let deviceId = localStorage.getItem('mimir_device_token');
    if (!deviceId) {
      deviceId = 'dev_' + crypto.randomUUID();
      localStorage.setItem('mimir_device_token', deviceId);
    }
    return deviceId;
  }
  const clientDeviceId = getOrCreateDeviceId();

  let bundleTasks = [];
  let taskFilesMap = {};
  let taskLockMap = {};

  function formatCairoDateTime(dateObj) {
    return dateObj.toLocaleString('en-US', {
      timeZone: 'Africa/Cairo',
      month: 'short', day: 'numeric', year: 'numeric',
      hour: 'numeric', minute: '2-digit', hour12: true
    });
  }

  if (!bundleCode) {
    document.getElementById('assign-title').textContent = 'Invalid Assignment Link';
    document.getElementById('student-form').style.display = 'none';
  } else {
    loadAssignmentBundle();
  }

  async function loadAssignmentBundle() {
    try {
      const res = await fetch(`/api/public/bundle/${bundleCode}`);
      const d = await res.json();

      if (!d.success) {
        document.getElementById('assign-title').textContent = d.error || 'Assignment Expired';
        document.getElementById('student-form').style.display = 'none';
        return;
      }

      bundleTasks = d.tasks || [];
      document.getElementById('assign-title').textContent = bundleTasks.length > 1 
        ? `Multi-Task Homework Assignment (${bundleTasks.length} Tasks)` 
        : bundleTasks[0].title;
      document.getElementById('assign-teacher').textContent = `Teacher: ${d.teacherName}`;

      if (d.deadline) {
        const dl = new Date(d.deadline);
        const dlBox = document.getElementById('assign-deadline');
        dlBox.style.display = 'block';
        const formattedCairo = formatCairoDateTime(dl);

        if (d.isPastDeadline || Date.now() > dl.getTime()) {
          dlBox.className = 'deadline-box deadline-expired';
          dlBox.innerHTML = `⛔ <b>Submissions Closed:</b> The deadline passed on ${formattedCairo} (Cairo Time).`;
          document.getElementById('student-form').style.display = 'none';
          return;
        } else {
          dlBox.textContent = `⏳ Submission Deadline: ${formattedCairo} (Cairo Time)`;
        }
      }

      await checkLocks();
      renderTasksUI();
    } catch (err) {
      document.getElementById('assign-title').textContent = 'Error connecting to server';
    }
  }

  async function checkLocks() {
    for (const t of bundleTasks) {
      taskFilesMap[t.code] = [];
      try {
        const r = await fetch(`/api/public/assignment/${t.code}/status?deviceId=${encodeURIComponent(clientDeviceId)}`);
        const st = await r.json();
        taskLockMap[t.code] = !!(st && st.hasSubmitted);
      } catch (e) {
        taskLockMap[t.code] = false;
      }
    }
  }

  function renderTasksUI() {
    const container = document.getElementById('tasks-container');
    const allDone = bundleTasks.every(t => taskLockMap[t.code]);

    if (allDone && bundleTasks.length > 0) {
      document.getElementById('submission-form-card').style.display = 'none';
      document.getElementById('submitted-name').textContent = 'Student';
      document.getElementById('success-screen').style.display = 'block';
      return;
    }

    container.innerHTML = bundleTasks.map((t, idx) => {
      const isDone = taskLockMap[t.code];
      return `
        <div class="task-card">
          <div class="task-title">
            <span>${idx + 1}. ${escapeHtml(t.title)}</span>
            ${isDone ? '<span style="font-size: 12px; color: #059669; font-weight: 600;">✓ Completed</span>' : ''}
          </div>

          ${isDone ? `
            <div style="padding: 10px; background: #ECFDF5; border: 1px solid #A7F3D0; border-radius: 6px; font-size: 13px; color: #065F46;">
              Your work for this task has been recorded.
            </div>
          ` : `
            <div class="dropzone" onclick="document.getElementById('file-input-${t.code}').click()">
              <div style="font-size: 24px; margin-bottom: 4px;">📷</div>
              <b>Tap to take photo or select pages for this task</b>
              <div style="font-size: 11.5px; color: var(--ink-soft); margin-top: 2px;">Supports camera photos, PNG, JPG, or PDF</div>
            </div>
            <input type="file" id="file-input-${t.code}" accept="image/*,.pdf" multiple style="display: none;" onchange="handleTaskFiles('${t.code}', event)" />
            <div id="preview-${t.code}" class="page-preview"></div>
          `}
        </div>
      `;
    }).join('');
  }

  function handleTaskFiles(taskCode, e) {
    if (!taskFilesMap[taskCode]) taskFilesMap[taskCode] = [];
    for (const f of e.target.files) taskFilesMap[taskCode].push(f);
    renderPreviews(taskCode);
    e.target.value = '';
  }

  function renderPreviews(taskCode) {
    const el = document.getElementById(`preview-${taskCode}`);
    if (!el) return;
    const files = taskFilesMap[taskCode] || [];
    el.innerHTML = files.map((f, i) => `
      <div class="page-chip">
        <span>📄 Page ${i + 1}: ${escapeHtml(f.name)} (${(f.size / 1024).toFixed(1)} KB)</span>
        <button type="button" class="page-remove" onclick="removeTaskFile('${taskCode}', ${i})">&times;</button>
      </div>
    `).join('');
  }

  function removeTaskFile(taskCode, i) {
    taskFilesMap[taskCode].splice(i, 1);
    renderPreviews(taskCode);
  }

  async function handleStudentSubmit(e) {
    e.preventDefault();
    const name = document.getElementById('student-name').value.trim();
    const btn = document.getElementById('submit-btn');

    const pending = bundleTasks.filter(t => !taskLockMap[t.code]);
    for (const t of pending) {
      if (!taskFilesMap[t.code] || !taskFilesMap[t.code].length) {
        alert(`Please attach at least one page or photo for: "${t.title}".`);
        return;
      }
    }

    btn.disabled = true;
    btn.textContent = 'Uploading and grading submissions...';

    try {
      for (const t of pending) {
        const formData = new FormData();
        formData.append('studentName', name);
        formData.append('deviceId', clientDeviceId);
        for (const f of taskFilesMap[t.code]) {
          formData.append('pages', f);
        }

        const res = await fetch(`/api/public/submit/${t.code}`, {
          method: 'POST',
          body: formData
        });
        const d = await res.json();
        if (!d.success) throw new Error(d.error || `Failed to evaluate ${t.title}`);
      }

      document.getElementById('submission-form-card').style.display = 'none';
      document.getElementById('submitted-name').textContent = name;
      document.getElementById('success-screen').style.display = 'block';
    } catch (err) {
      alert(err.message || 'Submission error. Please check your connection and retry.');
      btn.disabled = false;
      btn.textContent = '🚀 Submit All Tasks to Teacher';
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
</script>
</body>
</html>
